# Shared cargo config for the whole monorepo.
#
# This file lives at the repository root on purpose: cargo resolves configuration
# from the current working directory upwards. Turborepo runs its Cargo tasks
# (`cargo build`, `cargo test`, …) from the root of the Cargo workspace declared in
# the root `Cargo.toml`, so a root-level config applies to every invocation. A
# `crates/server/.cargo/config.toml` would only be seen by builds run inside the
# crate.
#
# >>> bindeps >>>
# Binary dependencies (RFC 3028) are still unstable, so cargo needs `-Z bindeps`.
# Declaring it here lets plain `cargo metadata` / `cargo build` work with the
# nightly toolchain pinned in the repository-root rust-toolchain.toml.
[unstable]
bindeps = true
# <<< bindeps <<<

# >>> ts-rs >>>
# `ts_rs::Config::from_env` reads these at runtime, so cargo's `[env]` table is
# what steers the `export_bindings_*` tests generated by `#[ts(export)]`.
# Cargo applies `[env]` to every process it launches, including `cargo test`.
#
# `relative = true` resolves the value against this file's parent directory,
# i.e. the repository root. The declarations land inside the SDK package that
# consumes them, so its build tooling owns and cleans the directory (and no
# `paths` alias is needed). The crate-local `./bindings` default would be buried
# in `crates/server`.
[env]
TS_RS_EXPORT_DIR = { value = "packages/sdk/src/generated", relative = true }
# JSON-RPC ids and codes are numbers on the wire; emitting `bigint` for `i64`
# would make them awkward to consume from JavaScript.
TS_RS_LARGE_INT = "number"
# Generated files import each other with no extension by default, which
# `moduleResolution: nodenext` rejects. Append `.js` so the specifiers resolve
# (`./Foo.js` resolves to `Foo.ts` under TypeScript's ESM resolution).
TS_RS_IMPORT_EXTENSION = "js"
# <<< ts-rs <<<
