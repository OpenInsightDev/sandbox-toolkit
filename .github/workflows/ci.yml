name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The changeset gate diffs against the base branch.
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true

      - run: vp install

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check
        run: vp run check

      # The version pull request consumes the changesets it releases, so it
      # never carries one of its own.
      - name: Require a changeset
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          sh tools/release/check-changeset.sh "origin/${{ github.base_ref }}"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true

      - run: vp install

      - uses: dtolnay/rust-toolchain@1.97.1

      # `~/.cache/sandbox-toolkit` holds the container's cargo home and target
      # directory, and is the largest part of a first run.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sandbox-toolkit
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The end-to-end suite drives the server in its Linux container, which the
      # ubuntu runner already has `docker` for.
      - name: Test
        run: vp run test
