[package]
name = "pty"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# The platform PTY pair and command builder; the async IO loop and process
# lifecycle handling are ours.
portable-pty = "0.9"
tokio = { version = "1.53.1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
libc = "0.2"
