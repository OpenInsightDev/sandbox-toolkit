[package]
name = "sandbox-toolkit"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eyre = "0.6.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

flate2 = "1.1"

# bindeps: `tgrep` has no prebuilt release channel.
tgrep = { version = "1.6.15", artifact = "bin", optional = true }

axum = { version = "0.8.9", features = ["http2", "macros"] }
rmcp = { version = "3.4.0", features = ["server", "transport-streamable-http-server"] }
rmcp-macros = "3.4.0"
thiserror = "2.0.20"
tokio-util = "0.7.13"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[build-dependencies]
flate2 = "1.1"
tar = "0.4"
# Only deflate entries need to be read.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[features]
default = []
jaq = []
tgrep = ["dep:tgrep"]
uv = []
deno = []
