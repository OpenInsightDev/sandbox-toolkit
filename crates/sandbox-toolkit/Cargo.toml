[package]
name = "sandbox-toolkit"
version = "0.0.1"
edition = "2024"

# The project is `sandbox-toolkit`; only the installed command is `sbxtkt`.
[[bin]]
name = "sbxtkt"
path = "src/main.rs"

[dependencies]
# Parses and validates `SKILL.md` frontmatter against the Agent Skills spec.
agent-plugins = "0.1.1"
anyhow = "1.0.104"
# Vendored as the git submodule at `crates/axum` (tokio-rs/axum @ 7c3c6787), because
# the released 0.8.9 has no `MethodFilter::QUERY` but the unreleased `main` does.
axum = { path = "../axum/axum", features = ["http2", "ws"] }
base64 = "0.22"
blake3 = "1.8"
bytes = { version = "1.12.1", features = ["serde"] }
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
# Resolves the platform cache directory the materialized binaries live under.
dirs = "7"
globset = "0.4.20"
httpdate = "1.0.3"
# `access(2)` has no std binding; the probe needs the effective-uid semantics of
# `faccessat`.
libc = "0.2"
mime_guess = "2.0.5"
percent-encoding = "2.3"
# The pty backend for interactive sessions: spawn, resize and process-group
# termination; the WebSocket session runtime is ours.
pty = { path = "../pty" }
rmcp = { version = "3.4.1", features = ["transport-streamable-http-server"] }
schemars = "1.0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
ropey = "1.6"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["codec", "io-util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
url = "2.5"
strum = { version = "0.28.0", features = ["derive"] }
regex = "1.13.1"
zstd = "0.13"

[build-dependencies]
blake3 = "1.8"
flate2 = "1.1"
# The build needs HTTPS to fetch the pinned release assets.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "io-util"] }
# Only deflate entries need to be read.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
zstd = "0.13"

[features]
default = []
binaries = ["jaq", "jq", "uv", "deno"]
jaq = []
jq = []
uv = []
deno = []

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in workspace tests.
tower = { version = "0.5.3", features = ["util"] }
